<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="leaf1">
      <path d="M0,-10 C6,-10 10,-4 10,2 C10,8 5,12 0,14 C-5,12 -10,8 -10,2 C-10,-4 -6,-10 0,-10 Z" fill="#F59E0B"/>
    </g>
    <g id="leaf2">
      <path d="M0,-8 C5,-8 9,-3 9,2 C9,7 4,10 0,12 C-4,10 -9,7 -9,2 C-9,-3 -5,-8 0,-8 Z" fill="#FB923C"/>
    </g>
    <g id="leaf3">
      <path d="M0,-9 C5,-9 9,-4 9,1 C9,6 4,11 0,13 C-4,11 -9,6 -9,1 C-9,-4 -5,-9 0,-9 Z" fill="#FCD34D"/>
    </g>
  </defs>

  <use href="#leaf1" x="60" y="0" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,-20; 0,160" dur="7s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 60 0;360 60 0" dur="4s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf2" x="180" y="0" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,-30; 0,170" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 180 0;-360 180 0" dur="5s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf3" x="320" y="0" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,-15; 0,150" dur="6.5s" begin="0.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 320 0;360 320 0" dur="3.5s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf1" x="480" y="0" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,-25; 0,165" dur="7.8s" begin="2.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 480 0;-360 480 0" dur="4.5s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf2" x="620" y="0" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,-10; 0,155" dur="6s" begin="1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 620 0;360 620 0" dur="3.8s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf3" x="760" y="0" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,-35; 0,170" dur="8s" begin="0.3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 760 0;-360 760 0" dur="5.2s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf1" x="900" y="0" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,-20; 0,160" dur="7.2s" begin="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 900 0;360 900 0" dur="4.2s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf2" x="1040" y="0" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,-15; 0,150" dur="6.8s" begin="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 1040 0;-360 1040 0" dur="3.6s" additive="sum" repeatCount="indefinite"/>
  </use>

  <use href="#leaf3" x="1150" y="0" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,-30; 0,165" dur="7.5s" begin="2.1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 1150 0;360 1150 0" dur="4.8s" additive="sum" repeatCount="indefinite"/>
  </use>
</svg>
